name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions
      - 'homework*'
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Boost, Doxygen, Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-all-dev doxygen graphviz

      - name: Configure
        run: cmake . -DPATCH_VERSION=${{ github.run_number }} -DWITH_GTEST=ON

      - name: Build
        run: cmake --build .

      - name: Test
        run: cmake --build . --target test

      - name: Package
        run: cmake --build . --target package

      - name: Verify .deb contains only bayan
        run: |
          DEB=$(ls bayan-*.deb)
          echo "--- Contents of $DEB ---"
          dpkg-deb -c "$DEB"
          if dpkg-deb -c "$DEB" | grep -qE '/(include|lib)/(gtest|gmock)'; then
            echo "ERROR: .deb contains gtest/gmock files!"
            exit 1
          fi

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          publish_branch: gh-pages
          keep_files: false

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_number }}
          name: Release ${{ github.run_number }}
          files: ./bayan-0.0.${{ github.run_number }}-Linux.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}